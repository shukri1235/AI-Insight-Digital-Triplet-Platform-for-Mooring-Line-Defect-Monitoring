# Mooring Twin settings. Copy to config.toml (next to the backend and frontend folders) and uncomment
# what you want to change. Precedence: environment variable > this file > built-in default.
# Restart the backend after editing. The Gemini API key does NOT go here - keep it in .env.
# PDF templates (logo, colours, company details) are separate: report_templates/*.json, editable in
# System -> Report templates.
# Relative paths are relative to this file's folder.

[paths]
# Managed media: uploads, incident clips, report frames  (env: FYP_MEDIA_DIR)
# media_dir = "backend/media"
# Folder with the YOLO weights (.pt)  (env: FYP_MODELS_DIR)
# models_dir = "backend/models"
# Main SQLite database  (env: FYP_DB_PATH)
# database = "backend/fyp_database.db"

[model]
# Weights loaded at start (file name in models_dir, or a full path)  (env: FYP_DEFAULT_MODEL)
# default = "best.pt"
# "auto", "cuda:0" or "cpu"  (env: FYP_DEVICE)
# device = "auto"
# FP16 inference on CUDA  (env: FYP_HALF)
# half = true

[live]
# Clip trigger threshold the Live slider starts at  (env: FYP_LIVE_TRIGGER)
# trigger_default = 0.6
# Live detections from this confidence are shown and logged  (env: FYP_LIVE_LOG_CONF)
# log_conf = 0.4
# The clip trigger must hold on this many ...  (env: TRIGGER_HITS)
# trigger_hits = 3
# ... of the last this many inferred frames (1 / 1 = any single frame)  (env: TRIGGER_WINDOW)
# trigger_window = 5
# Minimum seconds between two incident clips  (env: FYP_INCIDENT_COOLDOWN)
# incident_cooldown_sec = 10.0
# AUTO detection arms below this depth (m)  (env: FYP_AUTO_ARM_DEPTH)
# auto_arm_depth_m = 2.0
# Deformation at or above this confidence is labelled Critical  (env: FYP_CRITICAL_CONF)
# critical_conf = 0.6

[rov]
# Where BlueOS sends MAVLink (add this endpoint in BlueOS)  (env: FYP_MAVLINK_URL)
# mavlink_url = "udpin:0.0.0.0:14551"

[batch]
# Frames per second analysed in batch  (env: FYP_BATCH_SAMPLE_FPS)
# sample_fps = 2.0
# Frames per GPU batch  (env: FYP_BATCH_SIZE)
# batch_size = 8
# Decode batch video with ffmpeg (faster seeking)  (env: FYP_BATCH_FFMPEG)
# ffmpeg_reader = true

[gemini]
# Starting model (a model chosen in the app wins)  (env: GEMINI_MODEL)
# model = "gemini-3.8-flash"
# Used when the model is busy ("" = no fallback)  (env: GEMINI_FALLBACK_MODEL)
# fallback_model = "gemini-3.5-flash-lite"
# "low" (fast) or "high" (Gemini 3 models)  (env: GEMINI_THINKING)
# thinking = "low"
# Time limit for one Gemini request  (env: GEMINI_TIMEOUT_SEC)
# timeout_sec = 90.0
# Quick retries on the same model when it answers busy  (env: GEMINI_RETRIES)
# retries = 1
# Total time for a Gemini draft before the rules take over  (env: GEMINI_DEADLINE_SEC)
# deadline_sec = 150.0
# Minimum seconds between two AI reports (token saver)  (env: GEMINI_COOLDOWN_SEC)
# cooldown_sec = 30

[report]
# Events per report that get key frames (2 images each)  (env: FYP_REPORT_MAX_KEYFRAMES)
# max_keyframes = 4
# PDF template used when none is chosen (see report_templates/)  (env: FYP_REPORT_TEMPLATE)
# template = "default"
# Folder of PDF templates (one .json + logo per client)  (env: FYP_REPORT_TEMPLATES_DIR)
# templates_dir = "report_templates"

[server]
# Backend port  (env: FYP_PORT)
# port = 8500
# Let other PCs browse this PC's folders (off = this PC only)  (env: FYP_ALLOW_REMOTE_FS)
# allow_remote_fs = false
# UDP port of the Test Mode camera stream  (env: FYP_TEST_STREAM_PORT)
# test_stream_port = 5600
